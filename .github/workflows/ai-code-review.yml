# AI Code Review + auto-approver — umbrella reusable workflow from workleap/wl-github-actions.
name: "AI Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, converted_to_draft]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read
  issues: write

jobs:
  review:
    uses: workleap/wl-github-actions/.github/workflows/ai-code-review.yml@latest
    with:
      # Re-approve a code owner's approval dismissed by a trivial push
      # (wl-github-actions docs/github-pr-codeowner-reapproval.md).
      enable-reapproval: true
    secrets: inherit
