name: Reusable Renovate

on:
  workflow_call:
    inputs:
      workflow_name:
        description: 'The name for the renovate job'
        type: string
        required: true
      config_file:
        description: 'The renovate config file to use'
        type: string
        required: true
      log_file:
        description: 'The log file name for renovate output'
        type: string
        required: true
      autodiscover_filter:
        description: 'The repository filter pattern for autodiscovery'
        type: string
        required: false
        default: ''

# We are using OpenID Connect to authenticate with Azure with secret.
# https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-azure
permissions:
  id-token: write
  contents: read

jobs:
  renovate:
    runs-on: [idp]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get renovate-github-pat secret
        id: get_github_secret
        uses: workleap/wl-reusable-workflows/retrieve-managed-secret@main
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.WORKLEAP_GLOBAL_KEYVAULT_SUBSCRIPTION_ID }}
          keyvault-name: ${{ vars.WORKLEAP_GLOBAL_KEYVAULT_NAME }}
          secret-name: "renovate-github-pat"

      - name: Validate GitHub PAT
        shell: bash
        env:
          PAT: ${{ steps.get_github_secret.outputs.secret }}
        run: |
          set -euo pipefail
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/workleap/wl-reusable-workflows/contents/renovate.cli.json)
          echo "GitHub API returned HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Renovate GitHub PAT validation failed (HTTP $status). The token retrieved from Key Vault is missing, invalid, expired, or lacks 'contents:read' on workleap/wl-reusable-workflows."
            exit 1
          fi

      - name: Verify exactly one private/internal repository is accessible
        shell: bash
        env:
          PAT: ${{ steps.get_github_secret.outputs.secret }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          curl --silent --fail --show-error \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/workleap/repos?type=private&per_page=100" \
            -o "$tmp"
          count=$(jq '[.[] | select(.visibility == "private" or .visibility == "internal")] | length' "$tmp")
          if [ "$count" -le 10 ]; then
            echo "::error::Expected private/internal repositories accessible by the PAT, got $count."
            exit 1
          fi

      - name: Get renovate-tfc-token secret
        id: get_terraform_secret
        uses: workleap/wl-reusable-workflows/retrieve-managed-secret@main
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.WORKLEAP_GLOBAL_KEYVAULT_SUBSCRIPTION_ID }}
          keyvault-name: ${{ vars.WORKLEAP_GLOBAL_KEYVAULT_NAME }}
          secret-name: "renovate-tfc-token"

      - name: Get renovate-tfc-token secret
        id: get_ado_feeds_package_read_secret
        uses: workleap/wl-reusable-workflows/retrieve-managed-secret@main
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          keyvault-name: ${{ vars.IDP_CICD_KEYVAULT_NAME }}
          secret-name: "renovate-ado-feed-pat"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # Node.js 24 is required by Renovate v43+. v43 dropped support for Node 22.
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: ${{ inputs.workflow_name }}
        shell: bash
        # Version is pinned so runs are reproducible and a bad Renovate release
        # cannot silently break the workflow. Renovate itself opens a PR to bump
        # this value when a new version is published (see renovate.json customManagers).
        run: npx --yes renovate@44.51.2
        env:
          RENOVATE_CONFIG_FILE: ${{ inputs.config_file }}
          LOG_FILE: ${{ inputs.log_file }}
          RENOVATE_TOKEN: ${{ steps.get_github_secret.outputs.secret }}
          LOG_LEVEL: "debug"
          RENOVATE_DETECT_HOST_RULES_FROM_ENV: "true"
          RENOVATE_TERRAFORM__MODULE_APP_TERRAFORM_IO_TOKEN: ${{ steps.get_terraform_secret.outputs.secret }}
          RENOVATE_BINARY_SOURCE: "install"
          RENOVATE_AUTODISCOVER_FILTER: ${{ inputs.autodiscover_filter }}
          RENOVATE_HOST_RULES: |
            [
              {
                "matchHost": "https://pkgs.dev.azure.com",
                "username": "renovate-bot",
                "password": "${{ steps.get_ado_feeds_package_read_secret.outputs.secret }}"
              }
            ]

      # Ensure the output does not contain a line starting with "No repositories found"
      - name: Validate renovate output
        shell: bash
        run: cat ${{ inputs.log_file }} | jq --slurp -e 'any(.[].msg; test("^No repositories found")) | not'

      - uses: ./send-slack-notification
        if: failure() && github.event_name == 'schedule'
        with:
          webhook_url: ${{secrets.SLACK_WEBHOOK_URL_IDP_DEV_ALERTS}}
          messageTemplate: "FailedJob"
